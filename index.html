<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>tudou</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body, html {
            width: 100%; height: 100%; overflow: hidden; background: #000; 
            color: #ffffff; user-select: none; display: flex; justify-content: center; align-items: center;
        }

        .app-container {
            display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative;
            justify-content: space-between; 
            background: linear-gradient(180deg, #87d6cc 0%, #439485 35%, #16574c 100%);
            background-size: cover; background-position: center; overflow: hidden;
            /* 为模拟状态栏预留高度，避免顶部文字被遮挡 */
            padding-top: 42px; 
            /* 提前加环境安全区适配 */
            padding-top: calc(env(safe-area-inset-top) + 42px);
        }

        /* 物理横屏兜底 (状态栏现在位于容器内，会随容器一起旋转，彻底解决错位) */
        @media (orientation: landscape) {
            body { background: #000; }
            .app-container { width: 100vh; height: 100vw; transform: rotate(-90deg); transform-origin: center center; }
        }

        /* ==========================================
           核心修改：模拟系统状态栏移至容器内
           ========================================== */
        .fake-status-bar {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 42px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            /* 保持透明底色，不影响背景渐变 */
            background: transparent;
            color: #ffffff;
            z-index: 9999;
            font-size: 14px;
            font-weight: 500;
            /* 让点击穿透到下方触发全屏 */
            pointer-events: none; 
        }

        /* 左右图标容器 */
        .status-left, .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .battery-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .battery-icon {
            width: 22px;
            height: 12px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 3px;
            display: flex;
            align-items: center;
            padding: 1px;
            position: relative;
        }
        .battery-icon::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 3px;
            width: 2px;
            height: 4px;
            background: rgba(255,255,255,0.9);
            border-radius: 1px;
        }
        .battery-fill {
            width: 60%; /* 模拟60%电量 */
            height: 100%;
            background: #fff;
            border-radius: 1px;
        }
        .battery-text { font-size: 11px; }
        
        .signal-icon {
            display: flex; align-items: flex-end; gap: 2px; height: 12px;
        }
        .signal-bar {
            width: 3px; background: #fff; border-radius: 1px;
        }
        .signal-bar:nth-child(1) { height: 3px; }
        .signal-bar:nth-child(2) { height: 6px; }
        .signal-bar:nth-child(3) { height: 9px; }
        .signal-bar:nth-child(4) { height: 12px; }

        /* 顶部区域 (使用 padding 避开状态栏高度) */
        .top-area { 
            padding: 25px 20px 0; 
            display: flex; flex-direction: column; align-items: center; width: 100%; flex-shrink: 0; z-index: 2; 
        }
        .top-msg { width: 100%; max-width: 100%; overflow: hidden; white-space: nowrap; background: rgba(0, 0, 0, 0.12); border-radius: 20px; padding: 8px 0; box-sizing: border-box; margin-bottom: 20px; }
        .scroll-text { display: inline-block; animation: scrollRightToLeft 12s linear infinite; padding: 0 10px; font-size: clamp(11px, 1.5vw, 16px); font-weight: 400; color: rgba(255, 255, 255, 0.9); }
        @keyframes scrollRightToLeft { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        .brand-name { font-size: clamp(32px, 5vw, 56px); font-weight: 900; letter-spacing: clamp(2px, 0.4vw, 6px); margin-top: 10px; }
        .digital-clock { font-size: clamp(38px, 4vw, 60px); font-weight: 500; margin-top: 15px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }

        .lock-center { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            display: flex; flex-direction: column; align-items: center; z-index: 2; 
        }
        .lock-ring-container { 
            position: relative; width: 190px; height: 190px; display: flex; justify-content: center; align-items: center; 
            margin-bottom: 28px;
        }
        .ripple-ring { position: absolute; top: 50%; left: 50%; border-radius: 50%; transform: translate(-50%, -50%); animation: rippleExpand 4s ease-in-out infinite; }
        .ring-1 { width: 105px; height: 105px; background: rgba(58, 92, 99, 0.8); animation-delay: 0s; }
        .ring-2 { width: 135px; height: 135px; background: rgba(91, 156, 150, 0.5); animation-delay: 1s; }
        .ring-3 { width: 165px; height: 165px; background: rgba(112, 183, 171, 0.35); animation-delay: 2s; }
        .ring-4 { width: 190px; height: 190px; background: rgba(142, 212, 199, 0.2); animation-delay: 3s; }
        @keyframes rippleExpand { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; } 100% { transform: translate(-50%, -50%) scale(2); opacity: 0; } }
        .lock-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 95px; height: 95px; z-index: 10; border-radius: 50%; background: #3a5c63; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); }
        .lock-icon-svg { width: 50px; height: 50px; fill: none; stroke: #ffffff; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
        
        .info-text { text-align: center; font-size: clamp(20px, 2.5vw, 36px); font-weight: 360; letter-spacing: 1px; margin-top: 40px; }
        .info-date { font-size: clamp(16px, 2.2vw, 28px); font-weight: 280; opacity: 0.9; margin-top: 8px; letter-spacing: 1px; }

        /* 底部深色区域 */
        .bottom-area { 
            position: absolute; bottom: 0; left: 0; right: 0; width: 100%; height: 300px; 
            z-index: 1; touch-action: none; overflow: hidden; display: block; line-height: 0; font-size: 0; 
        }
        .arc-svg-bg { display: block; width: 100%; height: 100%; }

        .bottom-content { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; 
        }

        .version {
            position: absolute; bottom: 25px; left: 0; width: 100%; pointer-events: auto;
            text-align: center; font-size: 12px; color: #a0cdc1; font-weight: 300; 
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        /* 菜单展开时版本号淡出 */
        .bottom-area.open .version { opacity: 0; }

        .menu-slider { 
            position: absolute; bottom: 110px; 
            left: 0; width: 100%; pointer-events: auto;
            transform: translateY(calc(100% + 110px));
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            padding: 20px 0 0;
            z-index: 5;
        }

        .bottom-area.open .menu-slider { transform: translateY(0); }

        .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: auto auto; gap: 42px 0; margin: 0 auto; width: 100%; max-width: 340px; justify-items: center; }
        .menu-item { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #fff; font-size: 12px; font-weight: 400; width: 100%; }
        .menu-item svg { width: 32px; height: 32px; stroke: #fff; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
        .menu-item:nth-child(4) { grid-column: 1; }
        .menu-item:nth-child(5) { grid-column: 2; }

        @media (max-width: 360px) {
            .lock-ring-container { transform: scale(0.75); margin-bottom: -10px; } .menu-grid { max-width: 280px; }
            .bottom-area { height: 260px; }
            .menu-slider { bottom: 105px; transform: translateY(calc(100% + 105px)); }
        }
        @media (min-width: 600px) { .lock-ring-container { transform: scale(1.2); } }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- 新增：模拟系统顶部状态栏 (绝对定位于容器内，随内容旋转) -->
        <div class="fake-status-bar">
            <div class="status-left">
                <span id="fake-clock">17:34</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </div>
            <div class="status-right">
                <span>5G</span>
                <div class="signal-icon">
                    <div class="signal-bar"></div>
                    <div class="signal-bar"></div>
                    <div class="signal-bar"></div>
                    <div class="signal-bar"></div>
                </div>
                <div class="battery-wrap">
                    <div class="battery-icon"><div class="battery-fill"></div></div>
                    <span class="battery-text" id="fake-battery">58</span>
                </div>
            </div>
        </div>

        <!-- 顶部区域 -->
        <div class="top-area">
            <div class="top-msg"><span class="scroll-text">已完成 Help Desk 电话号码的修改。</span></div>
            <div class="brand-name">SΛMSUNG</div>
            <div class="digital-clock" id="clock-display">17:34:21</div>
        </div>

        <div class="lock-center">
            <div class="lock-ring-container">
                <div class="ripple-ring ring-1"></div><div class="ripple-ring ring-2"></div>
                <div class="ripple-ring ring-3"></div><div class="ripple-ring ring-4"></div>
                <div class="lock-wrapper">
                    <svg class="lock-icon-svg" viewBox="0 0 100 100">
                        <path d="M 35 40 V 30 a 15 15 0 0 1 30 0 V 40" />
                        <rect x="15" y="38" width="70" height="55" rx="10" />
                        <circle cx="50" cy="62" r="5" /><path d="M 50 67 L 50 84" />
                    </svg>
                </div>
            </div>
            <div class="info-text">保安策略已开启</div>
            <div class="info-date" id="date-display">2026年8月6日</div>
        </div>

        <div class="bottom-area" id="bottomPanel">
            <svg class="arc-svg-bg" viewBox="0 0 153.07 300" preserveAspectRatio="none" shape-rendering="crispEdges">
                <path d="M 0 45 A 120 120 0 0 1 153.07 45 L 153.07 300 L 0 300 Z" fill="#172f2d" />
            </svg>

            <div class="bottom-content" id="bottomContent">
                <div class="version">V1.0.1.3</div>
                
                <div class="menu-slider">
                    <div class="menu-grid">
                        <div class="menu-item"><svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7zM6 6h1v1H6zM6 17h1v1H6zM17 6h1v1h-1zM17 17h1v1h-1z"></path></svg><span>扫码</span></div>
                        <div class="menu-item"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><path d="M8 10h.01M12 10h.01M16 10h.01"></path></svg><span>消息</span></div>
                        <div class="menu-item"><svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg><span>设置</span></div>
                        <div class="menu-item"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg><span>条款</span></div>
                        <div class="menu-item"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg><span>Help Desk</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. 系统时钟与日期自动更新
        function updateTimeAndDate() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock-display').textContent = `${h}:${m}:${s}`;
            document.getElementById('fake-clock').textContent = `${h}:${m}`; // 同步模拟状态栏时间
            
            const year = now.getFullYear(); const month = now.getMonth() + 1; const day = now.getDate();
            document.getElementById('date-display').textContent = `${year}年${month}月${day}日`;
        }
        updateTimeAndDate(); setInterval(updateTimeAndDate, 1000);

        // 2. 全屏交互：点击任意位置触发沉浸式全屏 (保留导航栏回避状态栏)
        function safeFullscreen() {
            const el = document.documentElement;
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('portrait').then(() => { 
                    if (el.requestFullscreen) {
                        el.requestFullscreen().catch(() => { el.requestFullscreen(); });
                    }
                })
                .catch(() => { 
                    if (el.requestFullscreen) {
                        el.requestFullscreen().catch(() => { el.requestFullscreen(); });
                    }
                });
            } else { 
                if (el.requestFullscreen) {
                    el.requestFullscreen().catch(() => { el.requestFullscreen(); });
                }
            }
        }

        function bindFullscreenEvents() {
            document.addEventListener('touchstart', safeFullscreen, { once: true });
            document.addEventListener('click', safeFullscreen, { once: true });
        }
        bindFullscreenEvents();

        // 3. 底部菜单手势重构（兼容上下/左右旋转手势）
        function setupBottomPanelEvents() {
            const bottomPanel = document.getElementById('bottomPanel');
            if (!bottomPanel) return;
            const newPanel = bottomPanel.cloneNode(true);
            bottomPanel.parentNode.replaceChild(newPanel, bottomPanel);
            const freshPanel = document.getElementById('bottomPanel');

            let touchStartX = 0, touchStartY = 0;
            let touchDeltaX = 0, touchDeltaY = 0;
            let isSwiping = false;

            freshPanel.addEventListener('touchstart', function(e) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchDeltaX = 0; touchDeltaY = 0; isSwiping = false;
            }, { passive: true });

            freshPanel.addEventListener('touchmove', function(e) {
                if (touchStartY === 0 && touchStartX === 0) return;
                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;
                touchDeltaX = currentX - touchStartX;
                touchDeltaY = currentY - touchStartY;
                
                if (Math.abs(touchDeltaX) > 10 || Math.abs(touchDeltaY) > 10) {
                    isSwiping = true;
                    if (e.cancelable) e.preventDefault();
                }
            }, { passive: false });

            freshPanel.addEventListener('touchend', function(e) {
                if (!isSwiping) { 
                    touchStartX = 0; touchStartY = 0; 
                    touchDeltaX = 0; touchDeltaY = 0; 
                    return; 
                }
                
                const absX = Math.abs(touchDeltaX);
                const absY = Math.abs(touchDeltaY);
                
                if (absX > 40 || absY > 40) {
                    if (absX >= absY) {
                        if (touchDeltaX < 0) freshPanel.classList.add('open');   
                        else if (touchDeltaX > 0) freshPanel.classList.remove('open');
                    } else {
                        if (touchDeltaY < 0) freshPanel.classList.add('open');   
                        else if (touchDeltaY > 0) freshPanel.classList.remove('open'); 
                    }
                }
                
                touchStartX = 0; touchStartY = 0; 
                touchDeltaX = 0; touchDeltaY = 0; isSwiping = false;
            }, { passive: true });

            freshPanel.addEventListener('touchcancel', function(e) {
                touchStartX = 0; touchStartY = 0; 
                touchDeltaX = 0; touchDeltaY = 0; isSwiping = false;
            }, { passive: true });
        }

        setupBottomPanelEvents();

        // 全屏状态改变时，重试绑定手势（防失效）
        document.addEventListener('fullscreenchange', () => {
            setTimeout(() => { setupBottomPanelEvents(); }, 120);
            if (!document.fullscreenElement) { bindFullscreenEvents(); }
        });
    </script>
</body>
</html>
